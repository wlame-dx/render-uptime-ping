name: Uptime ping

on:
  schedule:
    # Render Free 15 dakika bos kalinca uyuyor; 5 dakikada bir disaridan ping.
    - cron: "*/5 * * * *"
    # Ayda bir kucuk commit: GitHub 60 gun islem olmayan repo'larda
    # zamanlanmis workflow'lari kapatabiliyor.
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Render health endpoint
        run: |
          set -e
          url="https://iptv-cloud.onrender.com/healthz"
          for attempt in 1 2 3; do
            echo "Ping attempt: $attempt"
            if curl --fail --silent --show-error --max-time 110 "$url"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1

  monthly-touch:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep scheduled workflows active
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-touch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-touch
          git commit -m "chore: keep scheduled workflow active" || true
          git push
